services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-url_shortener}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      DB_NAME: "${DB_NAME:-url_shortener}"
      DB_SYNCHRONIZE: "${DB_SYNCHRONIZE:-true}"
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${DB_USER:-url_shortener}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      POSTGRES_DB: "${DB_NAME:-url_shortener}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortener_worker
    command: ["node", "./dist/modules/analytics/workers/analytics.worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-url_shortener}"
      DB_PASSWORD: "${DB_PASSWORD:-local_dev_password}"
      DB_NAME: "${DB_NAME:-url_shortener}"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always 

  k6:
    image: grafana/k6
    profiles: ["load-test"]
    volumes:
      - ./src/scripts/shortener-test.js:/scripts/shortener-test.js:ro
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    command: ["run", "/scripts/shortener-test.js"]

volumes:
  postgres_data:
  redis_data:
